name: Compilar Editor IA EXE Windows
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir scripts PowerShell
        shell: powershell
        run: |
          foreach ($path in @('EditorIA.ps1','Iniciar_EditorIA.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $env:GITHUB_WORKSPACE $path),[ref]$tokens,[ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host ("Erro de sintaxe: " + $_.Message) }
              throw ("Script invalido: " + $path)
            }
          }
      - name: Gerar EditorIA.exe (.NET Framework do Windows)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw "Compilador C# nao encontrado" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $argsList = @(
            '/nologo','/target:winexe','/platform:anycpu','/optimize+',
            '/reference:System.dll','/reference:System.Windows.Forms.dll',
            '/out:dist\EditorIA.exe',
            '/resource:EditorIA.ps1,EditorIA.Main',
            '/resource:Iniciar_EditorIA.ps1,EditorIA.Start',
            'Windows\EditorIA.Launcher.cs'
          )
          & $csc @argsList
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'dist\EditorIA.exe')) { throw 'Falha ao compilar EXE' }
          Copy-Item EditorIA.ps1,Iniciar_EditorIA.ps1,README.md -Destination dist
          if (Test-Path Musicas) { Copy-Item Musicas -Destination dist -Recurse }
          Compress-Archive -Path 'dist\*' -DestinationPath 'EditorIA_1.4_Windows.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: EditorIA-1.4-Windows-EXE
          path: EditorIA_1.4_Windows.zip
          retention-days: 30
