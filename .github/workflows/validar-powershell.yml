name: Validar Editor IA PowerShell
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verificar-sintaxe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxe PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'EditorIA.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host "Sintaxe PowerShell valida"
      - name: Validar inicializador
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'Iniciar_EditorIA.ps1'),
            [ref]$tokens,[ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { exit 1 }
